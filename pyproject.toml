[project]
name = "trace-q"
version = "0.1.0"
description = "TRACE-Q event-driven quality traceability MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "cryptography==46.0.1",
  "fastapi==0.117.1",
  "httpx==0.28.1",
  "orjson==3.11.3",
  "psycopg[binary]==3.2.10",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "PyJWT==2.10.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.43",
  "streamlit==1.49.1",
  "uvicorn[standard]==0.36.0",
]

[project.optional-dependencies]
pq = ["liboqs-python>=0.10,<1"]

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "erp_emulator/tests", "factory_simulator/tests"]
addopts = "-q --strict-markers"
markers = ["postgres: requires the PostgreSQL integration database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "erp_emulator", "factory_simulator", "shared_contracts", "streamlit_app"]
