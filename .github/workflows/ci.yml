name: trace-q-ci

on:
  push:
  pull_request:

jobs:
  unit-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest==8.4.2 jsonschema==4.25.1
      - run: python scripts/generate_contracts.py --check
      - run: python scripts/check_contract_fixtures.py
      - run: pytest -m "not postgres"
      - run: python -m compileall -q backend erp_emulator worker streamlit_app scripts shared_contracts
